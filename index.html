<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#C93F2A">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Polyglotte">
<meta name="description" content="Japonais, coréen, chinois et anglais : vocabulaire, phrases de voyage, dialogues, grammaire, cartes et quiz.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>Polyglotte de poche</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@600&family=Noto+Serif+KR:wght@600&family=Noto+Serif+SC:wght@600&family=Schibsted+Grotesk:wght@400;500;600;700;800&display=swap">
<style>
/* Layout: one-column phone app — sticky header with the 4-language switch, fixed bottom tab bar.
   Signature: words sit in 田字格 practice squares (dashed cross), English on copybook lines.
   The accent recolours per language: 朱 vermilion (ja), 청 blue (ko), 玉 jade (zh), ochre (en). */
:root{
  --bg:#ECEFF4; --surface:#FFFFFF; --surface-2:#F5F7FA; --ink:#141A2A; --muted:#566077; --line:#D6DBE5; --chip:#E3E7EF;
  --good:#1D8049; --bad:#C23A2C; --good-soft:#E1F2E8; --bad-soft:#FBE6E3;
  --ja:#C93F2A; --ko:#2A57C8; --zh:#0D7D5F; --en:#A55B14;
  --on-acc:#FFFFFF;
  --shadow:0 1px 2px rgba(20,26,42,.06),0 6px 18px rgba(20,26,42,.07);
  --f-ui:"Schibsted Grotesk",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-ja:"Noto Serif JP","Hiragino Mincho ProN","Yu Mincho",serif;
  --f-ko:"Noto Serif KR","AppleMyungjo","Batang",serif;
  --f-zh:"Noto Serif SC","Songti SC","STSong","SimSun",serif;
  --radius:16px; --radius-s:11px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0E1119; --surface:#171C28; --surface-2:#1E2431; --ink:#E8EBF3; --muted:#9AA3B8; --line:#2A3142; --chip:#252C3B;
    --good:#57C98C; --bad:#FF8073; --good-soft:#15301F; --bad-soft:#3A1D1A;
    --ja:#FF7C64; --ko:#89AAFF; --zh:#4DCFA3; --en:#F0A75E;
    --on-acc:#0E1119; --shadow:0 1px 2px rgba(0,0,0,.35),0 8px 22px rgba(0,0,0,.28);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0E1119; --surface:#171C28; --surface-2:#1E2431; --ink:#E8EBF3; --muted:#9AA3B8; --line:#2A3142; --chip:#252C3B;
  --good:#57C98C; --bad:#FF8073; --good-soft:#15301F; --bad-soft:#3A1D1A;
  --ja:#FF7C64; --ko:#89AAFF; --zh:#4DCFA3; --en:#F0A75E;
  --on-acc:#0E1119; --shadow:0 1px 2px rgba(0,0,0,.35),0 8px 22px rgba(0,0,0,.28);
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{background:var(--bg)}
body{color:var(--ink);font-family:var(--f-ui);font-size:15px;line-height:1.5;-webkit-tap-highlight-color:transparent;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;padding:0;margin:0;cursor:pointer;text-align:inherit}
:focus-visible{outline:2.5px solid var(--acc);outline-offset:2px;border-radius:8px}
h1,h2,h3{margin:0;text-wrap:balance;letter-spacing:-.015em}
p{margin:0}

.app{--acc:var(--ja);--acc-soft:color-mix(in srgb,var(--acc) 12%,var(--surface));--acc-line:color-mix(in srgb,var(--acc) 42%,transparent);--acc-faint:color-mix(in srgb,var(--acc) 22%,transparent);
  max-width:560px;margin:0 auto;padding-inline:16px;padding-bottom:calc(86px + env(safe-area-inset-bottom,0px))}
.app[data-lang="ko"]{--acc:var(--ko)}
.app[data-lang="zh"]{--acc:var(--zh)}
.app[data-lang="en"]{--acc:var(--en)}

.tx-ja{font-family:var(--f-ja)} .tx-ko{font-family:var(--f-ko)} .tx-zh{font-family:var(--f-zh)} .tx-en{font-family:var(--f-ui)}
.tx{font-weight:600}
.ic{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}

/* Header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:10;margin-inline:-16px;padding:10px 16px 10px;background:color-mix(in srgb,var(--bg) 90%,transparent);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.seal{width:30px;height:30px;border-radius:7px;background:var(--acc);color:var(--on-acc);display:grid;place-items:center;font-family:var(--f-ja);font-weight:600;font-size:18px;transform:rotate(-5deg);box-shadow:inset 0 0 0 2px color-mix(in srgb,var(--on-acc) 30%,transparent);flex:none;transition:background .25s}
.brand-name{font-weight:800;font-size:17px;letter-spacing:-.02em;white-space:nowrap}
.brand-name span{font-weight:500;color:var(--muted)}
.brand-xp{margin-left:auto;font-size:12.5px;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap;display:flex;gap:10px}
.brand-xp b{color:var(--ink);font-weight:700}
.langs{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
.lang-btn{display:flex;flex-direction:column;align-items:center;padding:6px 2px 5px;border-radius:12px;background:var(--surface);border:1.5px solid var(--line);min-width:0;transition:border-color .2s,background .2s}
.lang-btn .n{font-size:16px;font-weight:600;line-height:1.3;white-space:nowrap}
.lang-btn small{font-size:10px;color:var(--muted);letter-spacing:.07em;text-transform:uppercase;font-weight:600}
.lang-btn[aria-pressed="true"]{border-color:var(--c);background:color-mix(in srgb,var(--c) 13%,var(--surface))}
.lang-btn[aria-pressed="true"] small{color:var(--c)}

/* Bottom tabs */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:10;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.tabs-in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr)}
.tab{display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 4px 9px;font-size:11.5px;font-weight:600;color:var(--muted);text-align:center}
.tab .ic{width:23px;height:23px}
.tab[aria-current="page"]{color:var(--acc)}

.view{display:flex;flex-direction:column;gap:22px;padding-top:16px}

/* Generic */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:16px}
.eyebrow{font-size:11.5px;letter-spacing:.09em;text-transform:uppercase;font-weight:700;color:var(--muted)}
.sec{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-bottom:10px}
.sec h2{font-size:19px;font-weight:800}
.sec span{font-size:12.5px;color:var(--muted);white-space:nowrap}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:10px 18px;border-radius:12px;font-weight:700;background:var(--chip);color:var(--ink);transition:transform .08s,background .2s}
.btn:active{transform:scale(.98)}
.btn.primary{background:var(--acc);color:var(--on-acc)}
.btn.ghost{background:transparent;border:1.5px solid var(--line)}
.btn.small{min-height:36px;padding:7px 13px;font-size:13.5px;border-radius:10px}
.btn.block{width:100%}
.btn.good{background:var(--good);color:var(--on-acc)}
.btn.bad{background:var(--bad-soft);color:var(--bad)}
.badge{display:inline-grid;place-items:center;min-width:24px;height:22px;padding:0 7px;border-radius:11px;background:color-mix(in srgb,var(--on-acc) 22%,transparent);font-size:12.5px;font-variant-numeric:tabular-nums}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{padding:7px 12px;border-radius:999px;background:var(--surface);border:1.5px solid var(--line);font-size:13.5px;font-weight:600;color:var(--muted);white-space:nowrap}
.chip[aria-pressed="true"]{border-color:var(--acc);color:var(--acc);background:var(--acc-soft)}
.pbar{height:8px;border-radius:4px;background:var(--chip);overflow:hidden}
.pbar i{display:block;height:100%;background:var(--acc);border-radius:4px;transition:width .4s}
.note{display:flex;gap:10px;padding:12px 14px;border-radius:var(--radius-s);background:var(--acc-soft);font-size:14px;line-height:1.5}
.note b{color:var(--acc)}
.muted{color:var(--muted)}
.num{font-variant-numeric:tabular-nums}
.iconbtn{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;background:var(--surface);border:1px solid var(--line);flex:none}
.say{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;background:var(--acc-soft);color:var(--acc);flex:none}
.say .ic{width:19px;height:19px}

/* 田字格 cells */
.cells{display:flex;justify-content:center}
.cell{--c:96px;width:var(--c);height:var(--c);position:relative;display:grid;place-items:center;border:1.5px solid var(--acc-line);margin-left:-1.5px;font-size:calc(var(--c) * .66);line-height:1;background:var(--surface);flex:none}
.cell:first-child{margin-left:0}
.cell::before,.cell::after{content:"";position:absolute;pointer-events:none}
.cell::before{left:0;right:0;top:50%;border-top:1px dashed var(--acc-faint)}
.cell::after{top:0;bottom:0;left:50%;border-left:1px dashed var(--acc-faint)}
.cell>span{position:relative;z-index:1;font-weight:600}
.copy{display:inline-block;padding:.05em .35em .12em;line-height:1.25;font-weight:600;
  background:
    linear-gradient(var(--acc-line),var(--acc-line)) 0 84%/100% 1.5px no-repeat,
    repeating-linear-gradient(to right,var(--acc-faint) 0 6px,transparent 6px 11px) 0 52%/100% 1px no-repeat,
    linear-gradient(var(--acc-faint),var(--acc-faint)) 0 16%/100% 1px no-repeat}
.bigtext{font-weight:600;line-height:1.35;text-align:center;overflow-wrap:anywhere;text-wrap:balance}

/* Home */
.hero{display:flex;flex-direction:column;gap:16px;box-shadow:var(--shadow)}
.hero-top{display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.hero-greet{display:flex;flex-direction:column;gap:2px;min-width:0}
.greet{display:inline-flex;align-items:center;gap:8px;font-size:26px;line-height:1.25;color:var(--ink)}
.greet .ic{color:var(--acc)}
.rom{font-size:13.5px;color:var(--muted)}
.stats3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stats3 div{display:flex;flex-direction:column;padding:10px 12px;border-radius:var(--radius-s);background:var(--surface-2)}
.stats3 b{font-size:22px;font-weight:800;font-variant-numeric:tabular-nums;line-height:1.2}
.stats3 span{font-size:12px;color:var(--muted)}
.goal{display:flex;flex-direction:column;gap:6px}
.goal-l{display:flex;justify-content:space-between;font-size:13px;font-weight:600}
.goal-l span:last-child{color:var(--muted);font-variant-numeric:tabular-nums}

.write-card{display:flex;align-items:center;gap:14px;width:100%;text-align:left}
.write-card .wg{font-size:30px;color:var(--acc);width:64px;height:64px;flex:none}
.write-card .wg .cell{--c:64px}
.write-card h3{font-size:16px;font-weight:700}
.write-card p{font-size:13px;color:var(--muted)}
.write-card .ic{margin-left:auto;color:var(--muted)}

.grp{font-size:12px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--acc);margin:18px 0 8px}
.sec+.grp{margin-top:4px}
.tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.tile{display:flex;flex-direction:column;align-items:flex-start;gap:3px;padding:14px;border-radius:var(--radius);background:var(--surface);border:1px solid var(--line);min-width:0;text-align:left}
.tile-glyph{font-size:25px;line-height:1.25;color:var(--acc);max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tile-name{font-weight:700;font-size:15px;line-height:1.3}
.tile-meta{font-size:12.5px;color:var(--muted);display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.tag{font-size:10.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:2px 6px;border-radius:5px;background:var(--acc-soft);color:var(--acc)}
.mini{height:4px;border-radius:2px;background:var(--chip);width:100%;overflow:hidden;margin-top:7px}
.mini i{display:block;height:100%;background:var(--acc)}

.navlist{list-style:none;margin:0;padding:0;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden}
.navlist li+li{border-top:1px solid var(--line)}
.navitem{display:flex;align-items:center;gap:12px;width:100%;padding:13px 14px;text-align:left}
.navitem .k{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;background:var(--acc-soft);color:var(--acc);font-weight:800;font-size:14px;flex:none;font-variant-numeric:tabular-nums}
.navitem .t{display:flex;flex-direction:column;min-width:0;flex:1}
.navitem .t b{font-weight:700;font-size:15px;line-height:1.35}
.navitem .t span{font-size:13px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.navitem>.ic{color:var(--muted)}

.emerg{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px;margin-top:10px}
.emerg div{padding:10px 12px;border-radius:var(--radius-s);background:var(--surface-2)}
.emerg b{display:block;font-size:24px;font-weight:800;color:var(--bad);font-variant-numeric:tabular-nums;line-height:1.2;user-select:all}
.emerg span{font-size:12.5px;color:var(--muted)}

/* Sub screens */
.subhead{display:flex;align-items:center;gap:12px}
.subhead h2{font-size:22px;font-weight:800;line-height:1.2}
.subhead p{font-size:13px;color:var(--muted)}
.actions{display:flex;gap:8px;flex-wrap:wrap}
.actions .btn{flex:1}

.list{list-style:none;margin:0;padding:0;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden}
.row{display:grid;grid-template-columns:auto minmax(0,1fr) auto auto;gap:12px;align-items:center;padding:11px 14px;cursor:pointer}
.row+.row{border-top:1px solid var(--line)}
.row-w{font-size:21px;line-height:1.3;overflow-wrap:anywhere}
.row-r{font-size:13px;color:var(--muted);line-height:1.4}
.row-fr{font-size:14px;text-align:right;max-width:9.5em;line-height:1.35}
.row.stack{grid-template-columns:auto minmax(0,1fr) auto}
.row.stack .row-w{font-size:18px}
.row.stack .row-fr{text-align:left;max-width:none;margin-top:3px;color:var(--ink)}
.lvl{width:9px;height:9px;border-radius:50%;border:1.5px solid var(--line);flex:none}
.lvl.l1{border-color:var(--acc);background:linear-gradient(90deg,var(--acc) 50%,transparent 50%)}
.lvl.l2{border-color:var(--acc);background:var(--acc)}

/* Dialogue */
.dlg-tools{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.dlg-tools .btn{margin-left:auto}
.dlg{display:flex;flex-direction:column;gap:10px}
.bubble{position:relative;max-width:88%;padding:10px 14px 11px;border-radius:16px;display:flex;flex-direction:column;gap:3px;transition:box-shadow .2s}
.bubble.them{align-self:flex-start;background:var(--acc-soft);border-bottom-left-radius:5px}
.bubble.me{align-self:flex-end;background:var(--surface);border:1px solid var(--line);border-bottom-right-radius:5px}
.bubble.speaking{box-shadow:0 0 0 2.5px var(--acc)}
.who{font-size:11px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);display:flex;align-items:center;justify-content:space-between;gap:10px}
.who .say{width:30px;height:30px;background:var(--surface)}
.bubble.me .who .say{background:var(--acc-soft)}
.who .say .ic{width:16px;height:16px}
.b-tx{font-size:19px;line-height:1.45}
.b-rom{font-size:13px;color:var(--muted)}
.b-fr{font-size:14px;line-height:1.4;padding-top:4px;margin-top:2px;border-top:1px dashed var(--acc-faint)}
.pager{display:flex;gap:8px;justify-content:space-between}
.pager .btn{flex:1}

/* Grammar */
.lesson h2{font-size:22px;font-weight:800;line-height:1.25;margin-bottom:10px}
.lesson .expl{font-size:15.5px;line-height:1.6;max-width:65ch}
.pattern{margin-top:14px;padding:14px;border-radius:var(--radius-s);border:1.5px dashed var(--acc-line);font-size:19px;text-align:center;line-height:1.5}
.ex{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.ex li{display:grid;grid-template-columns:auto minmax(0,1fr);gap:12px;align-items:start;padding:12px 0}
.ex li+li{border-top:1px solid var(--line)}
.ex .e1{font-size:19px;line-height:1.4}
.ex .e2{font-size:13px;color:var(--muted)}
.ex .e3{font-size:14px}

/* Writing */
.kana-grid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px}
.kana{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:0;padding:8px 2px 6px;border-radius:10px;background:var(--surface);border:1px solid var(--line);min-width:0}
.kana .g{font-size:26px;line-height:1.2}
.kana small{font-size:12px;color:var(--muted);font-weight:600}
.kana.empty{background:transparent;border:1px dashed var(--line)}
.jamo-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(64px,1fr));gap:6px}
.builder{display:flex;flex-direction:column;gap:12px}
.builder .res{display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.builder .res .cell{--c:96px}
.builder .lab{font-size:12px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);margin-bottom:6px}
.jchips{display:flex;flex-wrap:wrap;gap:5px}
.jchip{min-width:40px;height:40px;padding:0 8px;border-radius:10px;background:var(--surface);border:1.5px solid var(--line);font-size:19px;font-family:var(--f-ko);font-weight:600}
.jchip[aria-pressed="true"]{border-color:var(--acc);background:var(--acc-soft);color:var(--acc)}
.tones{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.tone-card{display:flex;flex-direction:column;gap:4px;padding:12px;border-radius:var(--radius-s);background:var(--surface);border:1px solid var(--line);text-align:left}
.tone-card .tc-top{display:flex;align-items:center;justify-content:space-between;gap:8px}
.tone-card .tc-p{font-size:22px;font-weight:700}
.tone-card .tc-c{font-size:26px}
.tone-card p{font-size:13px;color:var(--muted);line-height:1.4}
.tone{width:60px;height:42px;flex:none}
.tone .tl{stroke:var(--line);stroke-width:1}
.tone .tp{fill:none;stroke:var(--acc);stroke-width:3.5;stroke-linecap:round;stroke-linejoin:round}
.tone .td{fill:var(--acc)}
.chars{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:10px}
.charc{display:flex;flex-direction:column;align-items:center;gap:6px;padding:10px 4px;border-radius:var(--radius-s);background:var(--surface);border:1px solid var(--line)}
.charc .cell{--c:62px}
.charc small{font-size:12.5px;color:var(--muted);text-align:center;line-height:1.3}
.charc b{font-size:14px}
.tips{display:flex;flex-direction:column;gap:10px}
.tipc h3{font-size:16px;font-weight:700;margin-bottom:4px}
.tipc p{font-size:14px;line-height:1.5;color:var(--muted);max-width:65ch}
.tipc .chips{margin-top:10px}
.tipc .chip{color:var(--ink);display:inline-flex;align-items:center;gap:6px}
.tipc .chip .ic{width:15px;height:15px;color:var(--acc)}

/* Sessions */
.session-top{display:flex;align-items:center;gap:12px}
.session-top .pbar{flex:1}
.session-top .cnt{font-size:13px;font-weight:700;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.flash{min-height:330px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:24px 16px;border-radius:20px;background:var(--surface);border:1px solid var(--line);box-shadow:var(--shadow);text-align:center;cursor:pointer;position:relative}
.flash .hint{position:absolute;top:12px;left:14px;font-size:11.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.flash .fr-big{font-size:28px;font-weight:700;line-height:1.3;text-wrap:balance}
.flash .reading{font-size:15px;color:var(--muted)}
.flash .meaning{font-size:19px;font-weight:600}
.flash.turn{animation:turn .32s ease}

{id:"gare",note:"En Chine, les billets de train sont nominatifs : il faut son passeport pour les acheter et pour passer les contrôles.",lines:`

en:[
{id:"intro",b:"Jack",note:"« Nice to meet you » se dit à la première rencontre ; ensuite, on dit « Good to see you ».",lines:`
B|Hi! I'm Jack. Nice to meet you.||Salut ! Moi, c’est Jack. Enchanté.
A|Nice to meet you too. I'm Marie, I'm from France.||Enchantée aussi. Je suis Marie, je viens de France.
B|Oh, cool! Are you a student?||Oh, cool ! Tu es étudiante ?
A|Yes, I'm at university. I'm learning English.||Oui, je suis à l’université. J’apprends l’anglais.
B|Your English is really good!||Ton anglais est vraiment bon !
A|Thanks, but I still have a lot to learn.||Merci, mais j’ai encore beaucoup à apprendre.
`},
{id:"resto",note:"Aux États-Unis, on laisse 15 à 20 % de pourboire (tip) au restaurant. Au Royaume-Uni, on dit « the bill » plutôt que « the check ».",lines:`
B|Hi there! How many?||Bonjour ! Vous êtes combien ?
A|Two, please.||Deux, s’il vous plaît.
B|Right this way. Here are your menus.||Par ici. Voici vos menus.
A|Could we get two burgers, please?||On pourrait avoir deux burgers, s’il vous plaît ?
B|Sure. Anything to drink?||Bien sûr. Quelque chose à boire ?
A|Just tap water, thanks.||Juste une carafe d’eau, merci.
A|Could we have the check, please?||On pourrait avoir l’addition, s’il vous plaît ?
B|Here you go. That's thirty-two dollars.||Voilà. Ça fait 32 dollars.
`},
{id:"chemin",note:"« Take the second right » = « prenez la deuxième à droite ». On dit aussi « turn left / turn right ».",lines:`
A|Excuse me, how do I get to the train station?||Excusez-moi, comment je vais à la gare ?
B|Go straight ahead and take the second right.||Allez tout droit et prenez la deuxième à droite.
A|Is it far?||C’est loin ?
B|No, it's about a five-minute walk.||Non, c’est à environ cinq minutes à pied.
A|Thank you so much!||Merci beaucoup !
B|No problem!||Pas de souci !
`},
{id:"gare",note:"« Single / return » est britannique. Aux États-Unis, on dit « one-way / round trip ».",lines:`
A|Hi, one ticket to Oxford, please.||Bonjour, un billet pour Oxford, s’il vous plaît.
B|Single or return?||Aller simple ou aller-retour ?
A|Return, please.||Aller-retour, s’il vous plaît.
B|That's thirty-four pounds fifty.||Ça fait 34,50 livres.
A|Which platform does it leave from?||Il part de quel quai ?
B|Platform four.||Quai numéro 4.
`},
{id:"hotel",note:"Aux États-Unis, le « first floor » est le rez-de-chaussée ; au Royaume-Uni, c’est le « ground floor ».",lines:`
B|Good evening, welcome!||Bonsoir, bienvenue !
A|Hi, I'd like to check in. I have a reservation under Marie.||Bonjour, je voudrais faire le check-in. J’ai une réservation au nom de Marie.
B|Can I see your passport, please?||Je peux voir votre passeport, s’il vous plaît ?
B|Here's your key. You're in room 503.||Voici votre clé. Vous êtes dans la chambre 503.
A|What time is breakfast?||À quelle heure est le petit-déjeuner ?
B|From seven to ten a.m.||De 7 h à 10 h.
`},
{id:"shop",note:"Aux États-Unis, les prix affichés sont souvent hors taxes : la taxe s’ajoute à la caisse.",lines:`
A|Excuse me, how much is this?||Excusez-moi, combien ça coûte ?
B|It's twenty-five dollars.||25 dollars.
A|Do you have it in another color?||Vous l’avez dans une autre couleur ?
B|Yes, we have it in black and white.||Oui, en noir et en blanc.
A|I'll take the black one. Can I pay by card?||Je prends le noir. Je peux payer par carte ?
B|Sure, just tap here.||Bien sûr, approchez votre carte ici.
`},
{id:"temple",t:"Visiter une cathédrale",note:"En Angleterre, la visite des grandes cathédrales est souvent payante, mais l’entrée aux offices religieux est gratuite.",lines:`
A|Hi, how much is a ticket?||Bonjour, combien coûte un billet ?
B|It's twenty-five pounds, or twenty-two with a student card.||25 livres, ou 22 avec une carte d’étudiant.
A|Here's my student card. Can I take photos inside?||Voici ma carte d’étudiante. Je peux prendre des photos à l’intérieur ?
B|Yes, but no flash, please.||Oui, mais sans flash, s’il vous plaît.
A|Is there an audio guide in French?||Il y a un audioguide en français ?
B|Yes, it's included. Enjoy your visit!||Oui, il est compris. Bonne visite !
`},
{id:"anime",b:"Sam",note:"« To be into something » = être fan de quelque chose : I’m into manga.",lines:`
B|Hey Marie, are you into anime?||Salut Marie, tu es fan d’anime ?
A|Totally! I watch it all the time.||Carrément ! J’en regarde tout le temps.
B|What's your favorite?||C’est quoi ton préféré ?
A|I love Studio Ghibli movies.||J’adore les films du studio Ghibli.
B|Me too! Have you seen Spirited Away?||Moi aussi ! Tu as vu Le Voyage de Chihiro ?
A|Yeah, three times! No spoilers for the new one, though!||Oui, trois fois ! Mais pas de spoiler sur le nouveau !
`}
]

ja:[
{t:"Phrase de base : A は B です",d:"Le japonais met le verbe à la fin (sujet, objet, verbe). は (prononcé « wa ») indique le thème de la phrase ; です (desu) veut dire « est, sont » de façon polie. Au négatif, on remplace です par じゃありません (ja arimasen).",p:"A は B です",ex:[["私は学生です。","Watashi wa gakusei desu.","Je suis étudiant(e)."],["これはお茶です。","Kore wa ocha desu.","Ceci est du thé."],["私は先生じゃありません。","Watashi wa sensei ja arimasen.","Je ne suis pas professeur."]],tip:"On omet souvent 私は quand on parle de soi : 学生です suffit."},
{t:"Poser une question avec か",d:"Pour faire une question, on ajoute simplement か (ka) à la fin. L’ordre des mots ne change pas. Les mots interrogatifs (何 « quoi », どこ « où ») prennent la place de la réponse.",p:"… ですか？",ex:[["学生ですか？","Gakusei desu ka?","Vous êtes étudiant(e) ?"],["これは何ですか？","Kore wa nan desu ka?","Qu’est-ce que c’est ?"],["トイレはどこですか？","Toire wa doko desu ka?","Où sont les toilettes ?"]],tip:"何 se lit なん (nan) devant です."},
{t:"Les particules を, に, で",d:"Les particules se placent après le mot qu’elles marquent. を (o) marque l’objet, に (ni) la destination ou l’heure, で (de) le lieu où se passe l’action ou le moyen utilisé.",p:"Nを · Nに · Nで",ex:[["水を飲みます。","Mizu o nomimasu.","Je bois de l’eau."],["東京に行きます。","Tōkyō ni ikimasu.","Je vais à Tokyo."],["電車で行きます。","Densha de ikimasu.","J’y vais en train."],["レストランで食べます。","Resutoran de tabemasu.","Je mange au restaurant."]],tip:"を s’écrit « wo » mais se prononce « o »."},
{t:"Les verbes polis en -ます",d:"La forme en -ます est la forme polie à utiliser avec les inconnus. Il y a quatre terminaisons à connaître. Le japonais n’a pas de futur à part : 食べます veut dire « je mange » ou « je mangerai ».",p:"-ます · -ません · -ました · -ませんでした",ex:[["食べます","tabemasu","je mange"],["食べません","tabemasen","je ne mange pas"],["食べました","tabemashita","j’ai mangé"],["食べませんでした","tabemasen deshita","je n’ai pas mangé"]],tip:"Le verbe ne change pas selon la personne : 食べます = je mange, tu manges, nous mangeons…"},
{t:"Demander : をください, てください",d:"Pour demander un objet : objet + をください (o kudasai). Pour demander à quelqu’un de faire quelque chose : verbe à la forme en -て + ください.",p:"N をください · V-て ください",ex:[["コーヒーをください。","Kōhī o kudasai.","Un café, s’il vous plaît."],["ちょっと待ってください。","Chotto matte kudasai.","Attendez un instant, s’il vous plaît."],["ゆっくり話してください。","Yukkuri hanashite kudasai.","Parlez lentement, s’il vous plaît."]],tip:"お願いします (onegai shimasu) marche aussi : 水をお願いします."},
{t:"Les adjectifs en い et en な",d:"Il existe deux familles. Les adjectifs en い (高い, 安い) font leur négatif en remplaçant い par くない. Les adjectifs en な (きれい, 静か) prennent な devant un nom.",p:"高い → 高くない · きれいな町",ex:[["このかばんは高いです。","Kono kaban wa takai desu.","Ce sac est cher."],["高くないです。","Takakunai desu.","Ce n’est pas cher."],["きれいな町ですね。","Kirei na machi desu ne.","C’est une jolie ville, n’est-ce pas ?"]],tip:"いい (bon) est irrégulier : son négatif est よくない (yokunai)."},
{t:"Il y a : あります, います",d:"あります (arimasu) s’utilise pour les objets et les plantes, います (imasu) pour les personnes et les animaux. Le lieu est marqué par に.",p:"lieu に N が あります / います",ex:[["あそこにトイレがあります。","Asoko ni toire ga arimasu.","Il y a des toilettes là-bas."],["駅の前にコンビニがあります。","Eki no mae ni konbini ga arimasu.","Il y a une supérette devant la gare."],["猫がいます。","Neko ga imasu.","Il y a un chat."]],tip:"Au restaurant : 英語のメニューはありますか？ (Eigo no menyū wa arimasu ka?) « Avez-vous un menu en anglais ? »"},
{t:"Vouloir faire : -たいです",d:"Pour dire « je veux faire », on prend le verbe en -ます, on retire ます et on ajoute たいです.",p:"行きます → 行きたいです",ex:[["京都に行きたいです。","Kyōto ni ikitai desu.","Je veux aller à Kyoto."],["お寿司が食べたいです。","O-sushi ga tabetai desu.","Je veux manger des sushis."],["富士山が見たいです。","Fujisan ga mitai desu.","Je veux voir le mont Fuji."]],tip:"Au négatif : 行きたくないです (ikitakunai desu), « je ne veux pas y aller »."}
],
ko:[
{t:"Le thème 은/는 et « être » : 이에요/예요",d:"Le coréen met le verbe à la fin. 은 (eun, après consonne) ou 는 (neun, après voyelle) marque le thème. Pour dire « être », on ajoute 이에요 (ieyo) après une consonne ou 예요 (yeyo) après une voyelle.",p:"A은/는 B이에요/예요",ex:[["저는 학생이에요.","Jeoneun haksaengieyo.","Je suis étudiant(e)."],["이건 커피예요.","Igeon keopiyeyo.","Ceci est du café."],["저는 프랑스 사람이에요.","Jeoneun peurangseu saramieyo.","Je suis français(e)."]],tip:"Négatif : 이/가 아니에요. 저는 선생님이 아니에요 « Je ne suis pas professeur »."},
{t:"Le sujet 이/가 et l’objet 을/를",d:"이 (i, après consonne) ou 가 (ga, après voyelle) marquent le sujet. 을 (eul, après consonne) ou 를 (reul, après voyelle) marquent l’objet. À l’oral, on les omet souvent.",p:"N이/가 · N을/를",ex:[["물을 마셔요.","Mureul masyeoyo.","Je bois de l’eau."],["커피를 마셔요.","Keopireul masyeoyo.","Je bois du café."],["비가 와요.","Biga wayo.","Il pleut."]],tip:"Regarde la dernière syllabe : si elle finit par une consonne (물), prends la forme qui commence par une voyelle (을)."},
{t:"Le présent poli : -아요/-어요",d:"On retire 다 du verbe. Si la dernière voyelle est ㅏ ou ㅗ, on ajoute 아요 ; sinon 어요. Les verbes en 하다 deviennent 해요. C’est la forme polie de tous les jours.",p:"가다 → 가요 · 먹다 → 먹어요 · 하다 → 해요",ex:[["학교에 가요.","Hakgyoe gayo.","Je vais à l’école."],["밥을 먹어요.","Babeul meogeoyo.","Je mange."],["한국어를 공부해요.","Hangugeoreul gongbuhaeyo.","J’étudie le coréen."]],tip:"Pour poser une question, garde la même forme et monte la voix : 가요? « Tu y vas ? »"},
{t:"La négation : 안 et 못",d:"안 (an) devant le verbe = « ne … pas » (par choix). 못 (mot) = « ne peut pas » (impossibilité).",p:"안 + V · 못 + V",ex:[["고기를 안 먹어요.","Gogireul an meogeoyo.","Je ne mange pas de viande."],["오늘은 못 가요.","Oneureun mot gayo.","Je ne peux pas y aller aujourd’hui."],["안 매워요.","An maewoyo.","Ce n’est pas épicé."]],tip:"Pour les verbes en 하다, 안 se place juste avant 하다 : 공부 안 해요."},
{t:"Le passé : -았어요/-었어요",d:"Même règle que pour le présent : ㅏ ou ㅗ → 았어요, sinon 었어요, et 하다 → 했어요.",p:"갔어요 · 먹었어요 · 했어요",ex:[["서울에 갔어요.","Seoure gasseoyo.","Je suis allé(e) à Séoul."],["비빔밥을 먹었어요.","Bibimbabeul meogeosseoyo.","J’ai mangé un bibimbap."],["예약했어요.","Yeyakaesseoyo.","J’ai réservé."]],tip:"잘 먹었습니다 (« j’ai bien mangé ») se dit après le repas pour remercier."},
{t:"Demander poliment : 주세요",d:"Nom + 주세요 (juseyo) = « donnez-moi …, s’il vous plaît ». Verbe en -아/어 + 주세요 = « faites … pour moi, s’il vous plaît ».",p:"N 주세요 · V-아/어 주세요",ex:[["물 주세요.","Mul juseyo.","De l’eau, s’il vous plaît."],["이거 하나 주세요.","Igeo hana juseyo.","Un de ceux-ci, s’il vous plaît."],["천천히 말해 주세요.","Cheoncheonhi malhae juseyo.","Parlez lentement, s’il vous plaît."]],tip:"Ajoute 좀 (jom, « un peu ») pour adoucir : 물 좀 주세요."},
{t:"Les lieux : 에 et 에서",d:"에 (e) indique la destination ou l’endroit où l’on se trouve. 에서 (eseo) indique l’endroit où se passe une action, ou le point de départ.",p:"N에 가요 · N에서 V",ex:[["명동에 가요.","Myeongdonge gayo.","Je vais à Myeongdong."],["호텔에 있어요.","Hotere isseoyo.","Je suis à l’hôtel."],["식당에서 먹어요.","Sikdangeseo meogeoyo.","Je mange au restaurant."]],tip:"프랑스에서 왔어요 « Je viens de France » : ici, 에서 veut dire « depuis »."},
{t:"Vouloir : -고 싶어요",d:"Radical du verbe (sans 다) + 고 싶어요 (go sipeoyo) = « je veux faire ».",p:"가다 → 가고 싶어요",ex:[["부산에 가고 싶어요.","Busane gago sipeoyo.","Je veux aller à Busan."],["김치찌개를 먹고 싶어요.","Gimchijjigaereul meokgo sipeoyo.","Je veux manger un ragoût de kimchi."],["한복을 입어 보고 싶어요.","Hanbogeul ibeo bogo sipeoyo.","Je veux essayer un hanbok."]],tip:"Pour un objet : … 사고 싶어요 « je veux acheter … »."}
],
zh:[
{t:"Sujet + verbe + objet",d:"Comme en français, l’ordre est sujet, verbe, objet. Bonne nouvelle : les verbes ne se conjuguent jamais. 吃 (chī) veut dire « mange, mangeons, mangé… » ; c’est le contexte qui précise.",p:"S + V + O",ex:[["我喝茶。","Wǒ hē chá.","Je bois du thé."],["他吃米饭。","Tā chī mǐfàn.","Il mange du riz."],["我们去北京。","Wǒmen qù Běijīng.","Nous allons à Pékin."]],tip:"Le moment se précise avec des mots comme 今天 (aujourd’hui) ou 明天 (demain), en début de phrase."},
{t:"Être : 是, et les adjectifs avec 很",d:"是 (shì) relie deux noms : « A est B ». Mais devant un adjectif, on n’utilise pas 是 ! On met 很 (hěn), qui veut dire « très » mais sert surtout de lien.",p:"A 是 B · S 很 adj.",ex:[["我是学生。","Wǒ shì xuésheng.","Je suis étudiant(e)."],["我不是老师。","Wǒ bú shì lǎoshī.","Je ne suis pas professeur."],["这个很好吃。","Zhège hěn hǎochī.","C’est très bon."]],tip:"我很好 = « je vais bien ». On ne dit jamais 我是好."},
{t:"Les questions : 吗 et les mots interrogatifs",d:"Ajoute 吗 (ma) à la fin d’une phrase pour poser une question fermée. Avec un mot interrogatif (什么, 哪里, 谁), pas de 吗 : le mot prend simplement la place de la réponse.",p:"… 吗？ · 这是什么？",ex:[["你是法国人吗？","Nǐ shì Fǎguórén ma?","Tu es français(e) ?"],["这是什么？","Zhè shì shénme?","Qu’est-ce que c’est ?"],["地铁站在哪里？","Dìtiězhàn zài nǎlǐ?","Où est la station de métro ?"]],tip:"Pour répondre « oui », on répète le verbe : 你是学生吗？— 是。"},
{t:"La négation : 不 et 没",d:"不 (bù) nie le présent, le futur et les habitudes. 没 (méi) nie le passé et le verbe 有 « avoir » (没有).",p:"不 + V · 没 + V · 没有",ex:[["我不喝咖啡。","Wǒ bù hē kāfēi.","Je ne bois pas de café."],["我昨天没去。","Wǒ zuótiān méi qù.","Je n’y suis pas allé(e) hier."],["我没有现金。","Wǒ méiyǒu xiànjīn.","Je n’ai pas d’espèces."]],tip:"不 se prononce bú devant un 4e ton : 不是 bú shì, 不去 bú qù."},
{t:"Les classificateurs : 个, 张, 杯…",d:"Entre un nombre et un nom, il faut un classificateur. 个 (ge) est le plus courant et passe partout. Pour « deux », on dit 两 (liǎng) et non 二.",p:"nombre + classificateur + nom",ex:[["一个人","yí ge rén","une personne"],["两张票","liǎng zhāng piào","deux billets"],["三杯茶","sān bēi chá","trois tasses de thé"],["四碗米饭","sì wǎn mǐfàn","quatre bols de riz"]],tip:"张 pour les choses plates (billets, tables), 杯 pour les verres et les tasses, 碗 pour les bols."},
{t:"Action terminée : 了",d:"了 (le) après le verbe ou en fin de phrase montre qu’une action est accomplie ou qu’une situation a changé.",p:"V + 了",ex:[["我吃了。","Wǒ chī le.","J’ai mangé."],["我买了两张票。","Wǒ mǎi le liǎng zhāng piào.","J’ai acheté deux billets."],["太贵了！","Tài guì le!","C’est trop cher !"]],tip:"太…了 = « trop … » : 太好了！« Super ! »"},
{t:"Les lieux : 在",d:"在 (zài) veut dire « se trouver à ». Placé avant le verbe, il indique où se passe l’action.",p:"S 在 lieu · S 在 lieu + V",ex:[["我在上海。","Wǒ zài Shànghǎi.","Je suis à Shanghai."],["洗手间在哪里？","Xǐshǒujiān zài nǎlǐ?","Où sont les toilettes ?"],["我在餐厅吃饭。","Wǒ zài cāntīng chīfàn.","Je mange au restaurant."]],tip:"Contrairement au français, le lieu se place avant le verbe."},
{t:"Vouloir : 要 et 想",d:"要 (yào) = « vouloir, prendre » : direct, très utilisé pour commander. 想 (xiǎng) = « j’aimerais, j’ai envie de » : plus doux.",p:"要 + N/V · 想 + V",ex:[["我要这个。","Wǒ yào zhège.","Je prends celui-ci."],["我要两杯咖啡。","Wǒ yào liǎng bēi kāfēi.","Je voudrais deux cafés."],["我想去长城。","Wǒ xiǎng qù Chángchéng.","J’aimerais aller à la Grande Muraille."]],tip:"Au négatif, 不想 (bù xiǎng) « je n’ai pas envie » est plus doux que 不要 « je n’en veux pas »."}
],
en:[
{t:"Être et avoir : to be, to have",d:"« To be » se conjugue : I am, you are, he / she / it is, we / they are. À l’oral, on contracte : I’m, you’re, she’s. « To have » : I have, he / she has.",p:"I am · she is · they are · he has",ex:[["I'm French.","","Je suis français(e)."],["She's a student.","","Elle est étudiante."],["He has two brothers.","","Il a deux frères."]],tip:"Pour l’âge, l’anglais utilise « be » : I’m 20 = « j’ai 20 ans »."},
{t:"Le présent simple",d:"Pour les habitudes et les vérités générales. On ajoute -s à la 3e personne (he, she, it). Au négatif : don’t / doesn’t + verbe.",p:"I work · she works · I don't work",ex:[["I live in Paris.","","J’habite à Paris."],["She works in a hotel.","","Elle travaille dans un hôtel."],["He doesn't eat meat.","","Il ne mange pas de viande."]],tip:"Après doesn’t, le verbe perd son -s : she doesn’t work."},
{t:"Le présent continu : be + -ing",d:"Pour ce qui se passe en ce moment. On utilise be (am, is, are) + verbe en -ing.",p:"I'm eating · they're waiting",ex:[["I'm waiting for the bus.","","J’attends le bus."],["What are you doing?","","Qu’est-ce que tu fais ?"],["It's raining.","","Il pleut."]],tip:"Les verbes d’état (like, know, want) ne se mettent pas en -ing : on dit I know, pas « I’m knowing »."},
{t:"Le passé simple (prétérit)",d:"Pour une action terminée. Verbes réguliers : + -ed. Les irréguliers s’apprennent par cœur : go → went, eat → ate, see → saw, buy → bought.",p:"I visited · I went · I didn't go",ex:[["I visited London last year.","","J’ai visité Londres l’année dernière."],["We ate sushi yesterday.","","Nous avons mangé des sushis hier."],["Did you sleep well?","","Tu as bien dormi ?"]],tip:"Avec did / didn’t, le verbe revient à la base : Did you go? (pas « Did you went? »)."},
{t:"Poser une question : do, does, did",d:"Pour la plupart des verbes, on met do (présent), does (3e personne) ou did (passé) devant le sujet. Avec be et can, on inverse simplement.",p:"Do you…? · Does she…? · Did they…?",ex:[["Do you speak French?","","Tu parles français ?"],["Where does she live?","","Où habite-t-elle ?"],["Are you ready?","","Tu es prêt(e) ?"]],tip:"Mots interrogatifs : what, where, when, who, why, how, how much."},
{t:"Le futur : will et going to",d:"« Will » pour une décision prise sur le moment ou une prédiction. « Going to » pour un projet déjà prévu.",p:"I'll… · I'm going to…",ex:[["I'll take the black one.","","Je prends le noir."],["I'm going to visit Tokyo next month.","","Je vais visiter Tokyo le mois prochain."],["It will be sunny tomorrow.","","Il fera beau demain."]],tip:"À l’oral, will se contracte : I’ll, you’ll, it’ll."},
{t:"La politesse : could, would, can",d:"En anglais, on adoucit les demandes avec could et would. « I want » sonne brusque ; « I’d like » est la forme polie.",p:"Could you…? · I'd like… · Can I…?",ex:[["Could you help me, please?","","Pourriez-vous m’aider, s’il vous plaît ?"],["I'd like a coffee, please.","","Je voudrais un café, s’il vous plaît."],["Can I pay by card?","","Je peux payer par carte ?"]],tip:"Dis « please » et « thank you » souvent : c’est attendu, surtout au Royaume-Uni."},
{t:"Les articles : a, an, the",d:"a / an = « un, une ». On met « an » devant un son de voyelle (an apple, an hour). « The » = le, la, les, pour une chose précise.",p:"a ticket · an hour · the station",ex:[["I need a ticket.","","J’ai besoin d’un billet."],["The train leaves in an hour.","","Le train part dans une heure."],["Where is the station?","","Où est la gare ?"]],tip:"Pas d’article pour une généralité : I like coffee (pas « the coffee »)."}
]
};

const KEY="polyglotte-v1", GOAL=30, NEW_PER_DAY=8, INTERVALS=[0,1,2,4,8,16];
function defaults(){return {lang:"ja",prog:{ja:{},ko:{},zh:{},en:{}},xp:0,days:{},quiz:{ja:{n:0,best:0},ko:{n:0,best:0},zh:{n:0,best:0},en:{n:0,best:0}},rate:0.9,rom:true,auto:true,dir:"tf"};}
function load(){
  let d=defaults();
  try{const raw=localStorage.getItem(KEY); if(raw){const o=JSON.parse(raw); d=Object.assign(d,o); ORDER.forEach(l=>{d.prog[l]=d.prog[l]||{}; d.quiz[l]=d.quiz[l]||{n:0,best:0};}); d.days=d.days||{};}}catch(e){}
  if(!LANGS[d.lang]) d.lang="ja";
  return d;
}
let S=load();
function save(){try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}}
const UI={tab:"learn",learn:{screen:"home"},review:null,quiz:null,quizSrc:"all",wtab:"hira",kb:{i:"ㅎ",v:"ㅏ",f:"ㄴ"},dlg:{rom:true,tr:true},confirmReset:false};

function dayKey(d){d=d||new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");}
function today(){const d=new Date();return Math.floor(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate())/864e5);}
function addXP(n){S.xp+=n; const k=dayKey(); S.days[k]=(S.days[k]||0)+n;}
function todayXP(){return S.days[dayKey()]||0;}
function streak(){let n=0; const d=new Date(); if(!S.days[dayKey(d)]) d.setDate(d.getDate()-1); while(S.days[dayKey(d)]){n++; d.setDate(d.getDate()-1);} return n;}
function lvl(lang,id){const p=S.prog[lang][id]; if(!p) return 0; return p.b>=3?2:1;}
function langStats(lang){const p=S.prog[lang]; let known=0,learning=0; Object.keys(p).forEach(id=>{if(!ALL[id]) return; if(p[id].b>=3) known++; else learning++;}); return {known,learning,fresh:TOTAL-known-learning};}
function grade(id,ok){const p=S.prog[S.lang]; const c=p[id]||{b:0,d:0}; c.b=ok?Math.min(5,c.b+1):0; c.d=today()+INTERVALS[c.b]; p[id]=c; addXP(ok?2:1); save();}
function dueIds(lang){const p=S.prog[lang], td=today(); return Object.keys(p).filter(id=>ALL[id]&&p[id].d<=td);}
function freshItems(lang,n){const p=S.prog[lang], out=[]; for(const e of VOCAB_ALL.concat(PHRASE_ALL)){ if(!p[e.id]){out.push(e); if(out.length>=n) break;} } return out;}
function dailyQueue(lang){return shuffle(dueIds(lang).map(id=>ALL[id])).slice(0,40).concat(freshItems(lang,NEW_PER_DAY));}

function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]];} return a;}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));}
const $=s=>document.querySelector(s);

/* ================= VOIX ================= */
let voices=[];
const HAS_TTS=("speechSynthesis" in window)&&("SpeechSynthesisUtterance" in window);
function loadVoices(){try{voices=window.speechSynthesis.getVoices()||[];}catch(e){voices=[];}}
if(HAS_TTS){loadVoices(); try{window.speechSynthesis.addEventListener("voiceschanged",()=>{loadVoices(); if(UI.tab==="progress") render();});}catch(e){}}
const VPREF={ja:["ja-jp","ja"],ko:["ko-kr","ko"],zh:["zh-cn","cmn-hans","cmn","zh-hans","zh-tw","zh"],en:["en-us","en-gb","en"]};
function voiceFor(lang){
  if(!voices.length) return null;
  const norm=v=>String(v.lang||"").toLowerCase().replace("_","-");
  for(const p of VPREF[lang]){
    const v=voices.find(v=>{const n=norm(v); if(lang==="zh"&&(n.indexOf("hk")>=0||n.indexOf("yue")>=0)) return false; return n===p||n.startsWith(p+"-")||(p.length===2&&n.startsWith(p));});
    if(v) return v;
  }
  return null;
}
function canSpeak(lang){return HAS_TTS&&!!voiceFor(lang);}
function clean(t){return String(t).replace(/…/g," ").replace(/\s\/\s/g,", ").replace(/[()]/g," ").replace(/\s+/g," ").trim();}
let warned=false;
function speak(text,lang,onend){
  if(!HAS_TTS){ if(!warned){toast("La voix n’est pas disponible sur cet appareil."); warned=true;} return null; }
  try{
    window.speechSynthesis.cancel();
    const u=new SpeechSynthesisUtterance(clean(text));
    u.lang=LANGS[lang].bcp; const v=voiceFor(lang); if(v) u.voice=v;
    u.rate=S.rate;
    if(onend){u.onend=onend; u.onerror=onend;}
    window.speechSynthesis.speak(u);
    if(!v&&voices.length&&!warned){toast("Aucune voix "+LANGS[lang].name.toLowerCase()+" installée : voir Progrès › Voix."); warned=true;}
    return u;
  }catch(e){return null;}
}

/* ================= RENDU : BRIQUES ================= */
function tx(text,lang,cls){return `<span class="tx tx-${lang}${cls?" "+cls:""}" lang="${LANGS[lang].html}">${esc(text)}</span>`;}
function sayBtn(text,lang,label){return `<button class="say" data-act="say" data-t="${esc(text)}" data-l="${lang}" aria-label="${esc(label||"Écouter")}">${ICON.speaker}</button>`;}
function bigWord(text,lang,avail,max){
  avail=avail||300; max=max||110;
  const chars=Array.from(text);
  if(lang!=="en"&&chars.length<=6&&!/[\s…\/?？!！。、,，~]/.test(text)){
    const c=Math.min(max,Math.floor(avail/chars.length));
    return `<div class="cells" lang="${LANGS[lang].html}" style="--c:${c}px">${chars.map(ch=>`<span class="cell tx-${lang}" style="--c:${c}px"><span>${esc(ch)}</span></span>`).join("")}</div>`;
  }
  const n=chars.length;
  const fs=lang==="en"?(n<=8?46:n<=14?36:n<=24?28:22):(n<=10?32:n<=16?27:22);
  return `<div class="bigtext tx-${lang}" lang="${LANGS[lang].html}" style="font-size:${fs}px">${lang==="en"?`<span class="copy">${esc(text)}</span>`:esc(text)}</div>`;
}
function subhead(title,meta){return `<div class="subhead"><button class="iconbtn" data-act="back" aria-label="Retour">${ICON.back}</button><div><h2>${esc(title)}</h2>${meta?`<p>${meta}</p>`:""}</div></div>`;}
function noteBox(text){return text?`<div class="note"><span><b>Bon à savoir</b> · ${esc(text)}</span></div>`:"";}
function themeGlyph(t,lang){let best=null; t.items.slice(0,8).forEach(e=>{const w=e[lang].w; if(!best||Array.from(w).length<Array.from(best).length) best=w;}); return best;}

/* ================= LEÇONS ================= */
function renderLearn(){
  const s=UI.learn.screen;
  if(s==="theme") return renderTheme(UI.learn.id);
  if(s==="phrases") return renderPhrases(UI.learn.id);
  if(s==="dialogue") return renderDialogue(UI.learn.id);
  if(s==="grammar") return renderGrammar(+UI.learn.id);
  if(s==="writing") return renderWriting();
  return renderHome();
}
function renderHome(){
  const lang=S.lang, L=LANGS[lang], st=langStats(lang), g=GREET[lang];
  const txp=todayXP(), pct=Math.min(100,Math.round(txp/GOAL*100));
  const dueN=Math.min(40,dueIds(lang).length), newN=freshItems(lang,NEW_PER_DAY).length;
  const nameMark=lang==="en"?`<div class="bigtext" style="font-size:34px"><span class="copy">English</span></div>`:bigWord(L.native,lang,180,58);
  const wm=WRITING_META[lang];
  let h=installHint()+`<section class="card hero">
    <div class="hero-top">${nameMark}
      <div class="hero-greet"><p class="eyebrow">${L.name} · dire bonjour</p>
        <button class="greet" data-act="say" data-t="${esc(g.w)}" data-l="${lang}">${tx(g.w,lang)}${ICON.speaker}</button>
        ${g.rom?`<p class="rom">${esc(g.rom)}</p>`:""}</div>
    </div>
    <div class="stats3"><div><b>${st.known}</b><span>maîtrisés</span></div><div><b>${st.learning}</b><span>en cours</span></div><div><b>${TOTAL}</b><span>mots et phrases</span></div></div>
    <div class="goal"><div class="goal-l"><span>Objectif du jour</span><span>${Math.min(txp,GOAL)} / ${GOAL} XP</span></div><div class="pbar" role="progressbar" aria-valuenow="${pct}" aria-valuemin="0" aria-valuemax="100"><i style="width:${pct}%"></i></div></div>
    <button class="btn primary block" data-act="startReview" data-src="daily">Révision du jour <span class="badge">${dueN+newN}</span></button>
    <p class="muted" style="font-size:12.5px;text-align:center;margin-top:-6px">${dueN} à revoir · ${newN} nouveaux</p>
  </section>`;

  h+=`<section><div class="sec"><h2>Écriture</h2><span>${L.name}</span></div>
    <button class="card write-card" data-act="go" data-screen="writing"><span class="wg">${lang==="en"?`<span class="bigtext" style="font-size:30px"><span class="copy">th</span></span>`:`<span class="cell tx-${lang}" style="--c:64px" lang="${L.html}"><span>${wm.g}</span></span>`}</span>
    <span><h3>${wm.t}</h3><p>${wm.d}</p></span>${ICON.chev}</button></section>`;

  h+=`<section><div class="sec"><h2>Kit de voyage</h2><span>${PHRASE_ALL.length} phrases</span></div>
    <ul class="navlist">${PHRASES.map(c=>{const v=V(c.items[0],lang); return `<li><button class="navitem" data-act="go" data-screen="phrases" data-id="${c.id}"><span class="k">${c.items.length}</span><span class="t"><b>${esc(c.name)}</b><span lang="${L.html}">${esc(v.w)}</span></span>${ICON.chev}</button></li>`;}).join("")}</ul>
    <div class="card" style="margin-top:10px"><p class="eyebrow">Numéros d’urgence · ${EMERG[lang].c}</p><div class="emerg">${EMERG[lang].n.map(x=>`<div><b>${x[0]}</b><span>${esc(x[1])}</span></div>`).join("")}</div></div>
  </section>`;

  const tile=t=>{
    const known=t.items.filter(e=>lvl(lang,e.id)===2).length, p=Math.round(known/t.items.length*100);
    return `<button class="tile" data-act="go" data-screen="theme" data-id="${t.id}"><span class="tile-glyph tx tx-${lang}" lang="${L.html}">${esc(themeGlyph(t,lang))}</span><span class="tile-name">${esc(t.name)}</span><span class="tile-meta">${t.items.length} mots</span><span class="mini"><i style="width:${p}%"></i></span></button>`;};
  h+=`<section><div class="sec"><h2>Vocabulaire</h2><span>${THEMES.length} thèmes · ${VOCAB_ALL.length} mots</span></div>${GROUPS.map(g=>`<h3 class="grp">${esc(g[0])}</h3><div class="tiles">${g[1].map(id=>tile(THEMES.find(t=>t.id===id))).join("")}</div>`).join("")}</section>`;

  h+=`<section><div class="sec"><h2>Conversations</h2><span>${DLG_ORDER.length} dialogues</span></div><ul class="navlist">${DIALOGUES[lang].map(d=>`<li><button class="navitem" data-act="go" data-screen="dialogue" data-id="${d.id}"><span class="t"><b>${esc(dlgTitle(lang,d.id))}</b><span lang="${L.html}">${esc(d.L[0].t)}</span></span>${ICON.chev}</button></li>`).join("")}</ul></section>`;

  h+=`<section><div class="sec"><h2>Grammaire</h2><span>${GRAMMAR[lang].length} leçons</span></div><ul class="navlist">${GRAMMAR[lang].map((g,i)=>`<li><button class="navitem" data-act="go" data-screen="grammar" data-id="${i}"><span class="k">${i+1}</span><span class="t"><b lang="${L.html}">${esc(g.t)}</b></span>${ICON.chev}</button></li>`).join("")}</ul></section>`;
  return h;
}
function isStandalone(){try{return window.matchMedia("(display-mode: standalone)").matches||window.navigator.standalone===true;}catch(e){return false;}}
function installHint(){
  if(isStandalone()||S.hideHint) return "";
  const ios=/iPhone|iPad|iPod/.test(navigator.userAgent);
  const how=ios?"Dans Safari : Partager (dans le menu ••• sur les iPhone récents) › « Sur l’écran d’accueil », avec « Ouvrir comme app web » activé."
               :"Dans Chrome : menu ⋮ › « Installer l’application » ou « Ajouter à l’écran d’accueil ».";
  return `<div class="note" style="flex-direction:column;gap:10px"><span><b>Installer l’appli</b> · ${how} Ensuite, elle marche sans internet.</span><button class="btn small ghost" data-act="hideHint" style="align-self:flex-start">C’est fait</button></div>`;
}
function wordRow(e,lang,stack){
  const v=V(e,lang), r=reading(v,lang), l=lvl(lang,e.id);
  const dot=`<span class="lvl ${l===2?"l2":l===1?"l1":""}" title="${l===2?"Maîtrisé":l===1?"En cours":"Nouveau"}"></span>`;
  if(stack) return `<li class="row stack" data-act="say" data-t="${esc(v.say)}" data-l="${lang}">${sayBtn(v.say,lang)}<div><div class="row-w">${tx(v.w,lang)}</div>${r?`<div class="row-r">${esc(r)}</div>`:""}<div class="row-fr">${esc(v.fr)}</div></div>${dot}</li>`;
  return `<li class="row" data-act="say" data-t="${esc(v.say)}" data-l="${lang}">${sayBtn(v.say,lang)}<div><div class="row-w">${tx(v.w,lang)}</div>${r?`<div class="row-r">${esc(r)}</div>`:""}</div><div class="row-fr">${esc(v.fr)}</div>${dot}</li>`;
}
function renderTheme(id){
  const t=THEMES.find(x=>x.id===id)||THEMES[0], lang=S.lang;
  const known=t.items.filter(e=>lvl(lang,e.id)===2).length;
  return subhead(t.name,`${t.items.length} mots · ${known} maîtrisés`)
   +noteBox(t.note[lang])
   +`<div class="actions"><button class="btn primary" data-act="startReview" data-src="${t.id}">${ICON.cards} Cartes</button><button class="btn" data-act="startQuiz" data-src="${t.id}">${ICON.quiz} Quiz</button></div>`
   +`<ul class="list">${t.items.map(e=>wordRow(e,lang,false)).join("")}</ul>`
   +`<p class="muted" style="font-size:12.5px;text-align:center">Touche une ligne pour l’écouter.</p>`;
}
function renderPhrases(id){
  const c=PHRASES.find(x=>x.id===id)||PHRASES[0], lang=S.lang;
  return subhead("Kit de voyage",`${c.name} · ${c.items.length} phrases`)
   +`<div class="chips" role="group" aria-label="Catégories">${PHRASES.map(x=>`<button class="chip" data-act="go" data-screen="phrases" data-id="${x.id}" aria-pressed="${x.id===c.id}">${esc(x.name)}</button>`).join("")}</div>`
   +`<div class="actions"><button class="btn primary" data-act="startReview" data-src="p-${c.id}">${ICON.cards} Cartes</button><button class="btn" data-act="startQuiz" data-src="p-${c.id}">${ICON.quiz} Quiz</button></div>`
   +`<ul class="list">${c.items.map(e=>wordRow(e,lang,true)).join("")}</ul>`
   +(c.id==="urgences"?`<div class="card"><p class="eyebrow">Numéros d’urgence · ${EMERG[lang].c}</p><div class="emerg">${EMERG[lang].n.map(x=>`<div><b>${x[0]}</b><span>${esc(x[1])}</span></div>`).join("")}</div></div>`:"");
}
function renderDialogue(id){
  const lang=S.lang, L=LANGS[lang], d=DIALOGUES[lang].find(x=>x.id===id)||DIALOGUES[lang][0];
  const meta=DLG_META[d.id], role=d.b||meta.b, i=DLG_ORDER.indexOf(d.id);
  const prev=DLG_ORDER[i-1], next=DLG_ORDER[i+1];
  return subhead(dlgTitle(lang,d.id),`Conversation ${i+1} sur ${DLG_ORDER.length} · ${d.L.length} répliques`)
   +`<div class="dlg-tools">${lang!=="en"?`<button class="chip" data-act="dlgToggle" data-k="rom" aria-pressed="${UI.dlg.rom}">${L.rom.charAt(0).toUpperCase()+L.rom.slice(1)}</button>`:""}<button class="chip" data-act="dlgToggle" data-k="tr" aria-pressed="${UI.dlg.tr}">Traduction</button>
     <button class="btn small primary" data-act="dlgPlay" id="dlgPlay">${seq?ICON.stop+" Arrêter":ICON.play+" Tout écouter"}</button></div>`
   +`<div class="dlg">${d.L.map((l,k)=>`<div class="bubble ${l.s==="A"?"me":"them"}" data-line="${k}">
      <div class="who"><span>${l.s==="A"?"Vous":esc(role)}</span>${sayBtn(l.t,lang,"Écouter la réplique")}</div>
      <p class="b-tx">${tx(l.t,lang)}</p>${UI.dlg.rom&&l.r?`<p class="b-rom">${esc(l.r)}</p>`:""}${UI.dlg.tr?`<p class="b-fr">${esc(l.fr)}</p>`:""}</div>`).join("")}</div>`
   +noteBox(d.note)
   +`<div class="pager">${prev?`<button class="btn ghost" data-act="go" data-screen="dialogue" data-id="${prev}">${ICON.back} ${esc(dlgTitle(lang,prev))}</button>`:"<span></span>"}${next?`<button class="btn ghost" data-act="go" data-screen="dialogue" data-id="${next}">${esc(dlgTitle(lang,next))} ${ICON.chev}</button>`:""}</div>`;
}
function renderGrammar(i){
  const lang=S.lang, L=LANGS[lang], list=GRAMMAR[lang]; i=Math.max(0,Math.min(list.length-1,i||0)); const g=list[i];
  return subhead(`Leçon ${i+1} sur ${list.length}`,"Grammaire · "+L.name)
   +`<article class="card lesson"><h2 lang="${L.html}">${esc(g.t)}</h2><p class="expl">${esc(g.d)}</p><div class="pattern tx-${lang}" lang="${L.html}">${esc(g.p)}</div></article>`
   +`<section><div class="sec"><h2>Exemples</h2><span>touche pour écouter</span></div><ul class="card ex" style="padding-block:4px">${g.ex.map(x=>`<li>${sayBtn(x[0],lang)}<div><div class="e1">${tx(x[0],lang)}</div>${x[1]?`<div class="e2">${esc(x[1])}</div>`:""}<div class="e3">${esc(x[2])}</div></div></li>`).join("")}</ul></section>`
   +noteBox(g.tip)
   +`<div class="pager">${i>0?`<button class="btn ghost" data-act="go" data-screen="grammar" data-id="${i-1}">${ICON.back} Leçon ${i}</button>`:"<span></span>"}${i<list.length-1?`<button class="btn primary" data-act="go" data-screen="grammar" data-id="${i+1}">Leçon ${i+2} ${ICON.chev}</button>`:""}</div>`;
}
function toneSvg(t){
  const y=l=>36-(l-1)*7.5; let shape="";
  if(t===1) shape=`<polyline class="tp" points="6,${y(5)} 54,${y(5)}"/>`;
  else if(t===2) shape=`<polyline class="tp" points="6,${y(3)} 54,${y(5)}"/>`;
  else if(t===3) shape=`<polyline class="tp" points="6,${y(2)} 28,${y(1)} 54,${y(4)}"/>`;
  else if(t===4) shape=`<polyline class="tp" points="6,${y(5)} 54,${y(1)}"/>`;
  else shape=`<circle class="td" cx="30" cy="${y(2.5)}" r="3.5"/>`;
  return `<svg viewBox="0 0 60 42" class="tone" aria-hidden="true">${[1,2,3,4,5].map(l=>`<line class="tl" x1="2" x2="58" y1="${y(l)}" y2="${y(l)}"/>`).join("")}${shape}</svg>`;
}
function renderWriting(){

    h+=`<div class="chips"><button class="chip" data-act="wtab" data-v="hira" aria-pressed="${!kata}">Hiragana ひらがな</button><button class="chip" data-act="wtab" data-v="kata" aria-pressed="${kata}">Katakana カタカナ</button></div>`;
    h+=noteBox(kata?"Les katakana servent surtout aux mots étrangers : コーヒー (kōhī, café), ホテル (hoteru, hôtel). Le trait ー allonge la voyelle.":"Les hiragana écrivent les mots japonais et les terminaisons grammaticales. Touche un signe pour l’entendre.");

    h+=`<section><div class="sec"><h2>Sons voisés</h2><span>avec ゛ et ゜</span></div><div class="kana-grid">${dak.map((c,k)=>`<button class="kana" data-act="say" data-t="${c}" data-l="ja"><span class="g tx tx-ja" lang="ja">${c}</span><small>${DAK_ROM[k]}</small></button>`).join("")}</div></section>`;
    h+=`<div class="card tips"><div class="tipc"><h3>Petits signes, grands effets</h3><p>Un petit っ double la consonne suivante : きって (kitte, timbre). Les petits ゃ ゅ ょ forment des combinaisons : きゃ (kya), しゅ (shu), ちょ (cho).</p>
      <div class="chips">${[["きって","kitte"],["きゃ","kya"],["しゅ","shu"],["ちょ","cho"]].map(x=>`<button class="chip" data-act="say" data-t="${x[0]}" data-l="ja">${ICON.speaker}<span class="tx-ja" lang="ja">${x[0]}</span> ${x[1]}</button>`).join("")}</div></div></div>`;
  } else if(lang==="ko"){
    const kb=UI.kb, syl=String.fromCharCode(0xAC00+(KO_I.indexOf(kb.i)*21+KO_V.indexOf(kb.v))*28+KO_F.indexOf(kb.f));
    const rr=(R_I[kb.i]||"")+(R_V[kb.v]||"")+(R_F[kb.f]||"");
    h+=noteBox("Une syllabe coréenne = consonne + voyelle (+ consonne finale), rangées dans un carré. ㅇ en début de syllabe est muet : 아 se lit « a ».");
    h+=`<section class="card builder"><p class="eyebrow">Atelier de syllabes</p>
      <div class="res"><div class="cells" lang="ko"><span class="cell tx-ko" style="--c:96px"><span>${syl}</span></span></div>
        <div><p style="font-size:22px;font-weight:700">${esc(kb.i)} + ${esc(kb.v)}${kb.f?" + "+esc(kb.f):""}</p><p class="rom">se lit « ${esc(rr)} »</p><div style="margin-top:8px">${sayBtn(syl,"ko","Écouter la syllabe")}</div></div></div>
      <div><p class="lab">Consonne de départ</p><div class="jchips">${B_I.map(j=>`<button class="jchip" data-act="kb" data-k="i" data-v="${j}" aria-pressed="${kb.i===j}">${j}</button>`).join("")}</div></div>
      <div><p class="lab">Voyelle</p><div class="jchips">${B_V.map(j=>`<button class="jchip" data-act="kb" data-k="v" data-v="${j}" aria-pressed="${kb.v===j}">${j}</button>`).join("")}</div></div>
      <div><p class="lab">Consonne finale (batchim)</p><div class="jchips">${B_F.map(j=>`<button class="jchip" data-act="kb" data-k="f" data-v="${j}" aria-pressed="${kb.f===j}">${j||"aucune"}</button>`).join("")}</div></div>
      <p class="muted" style="font-size:13px">Exemple : 한 + 국 = 한국 (Hanguk, la Corée).</p></section>`;
    h+=`<section><div class="sec"><h2>Consonnes</h2><span>14 + 5 doubles</span></div><div class="jamo-grid">${KO_CONS.map(x=>`<button class="kana" data-act="say" data-t="${x[2]}" data-l="ko"><span class="g tx tx-ko" lang="ko">${x[0]}</span><small>${x[1]}</small></button>`).join("")}</div></section>`;
    h+=`<section><div class="sec"><h2>Voyelles</h2><span>10 + 7 composées</span></div><div class="jamo-grid">${KO_VOW.map(x=>`<button class="kana" data-act="say" data-t="${x[2]}" data-l="ko"><span class="g tx tx-ko" lang="ko">${x[0]}</span><small>${x[1]}</small></button>`).join("")}</div></section>`;

/* ================= CARTES (RÉVISION) ================= */
function srcItems(src){
  if(src==="all") return VOCAB_ALL.slice();
  if(src==="phrases") return PHRASE_ALL.slice();
  if(src.indexOf("p-")===0){const c=PHRASES.find(c=>"p-"+c.id===src); return c?c.items.slice():[];}
  const t=THEMES.find(t=>t.id===src); return t?t.items.slice():[];
}
function srcName(src){
  if(src==="daily") return "Révision du jour"; if(src==="all") return "Tout le vocabulaire"; if(src==="phrases") return "Kit de voyage"; if(src==="mist") return "Erreurs à revoir";
  if(src.indexOf("p-")===0){const c=PHRASES.find(c=>"p-"+c.id===src); return c?"Voyage · "+c.name:"";}
  const t=THEMES.find(t=>t.id===src); return t?t.name:"";
}
function startReview(src,ids){
  let items;
  if(ids) items=ids.map(id=>ALL[id]).filter(Boolean);
  else if(src==="daily") items=dailyQueue(S.lang);
  else items=shuffle(srcItems(src)).slice(0,20);

  UI.review={src,q:items.map(e=>e.id),i:0,flipped:false,ok:0,bad:0,re:{},done:false};
  UI.tab="review"; render(); toTop();
}

/* ================= QUIZ ================= */
function startQuiz(src,ids){
  let pool=ids?ids.map(id=>ALL[id]).filter(Boolean):srcItems(src);
  if(!pool.length){toast("Pas assez de mots pour un quiz."); return;}
  const base=shuffle(pool.slice()).slice(0,10);
  const types=["read","write"]; if(canSpeak(S.lang)) types.push("listen");
  const qs=base.map(e=>{const type=types[Math.floor(Math.random()*types.length)]; return {id:e.id,type,opts:shuffle([e.id].concat(distractors(e,pool,type))),ans:null};});
  UI.quiz={src,qs,i:0,score:0,done:false,wrong:[]}; UI.quizSrc=src;
  UI.tab="quiz"; render(); toTop(); autoListen();
}
function distractors(e,pool,type){
  const lang=S.lang, ve=V(e,lang), out=[], seen=new Set();
  const key=x=>type==="write"?x.w:x.fr; seen.add(key(ve));
  const wider=shuffle((e.kind==="p"?PHRASE_ALL:VOCAB_ALL).filter(x=>x.id!==e.id));
  const cands=shuffle(pool.filter(x=>x.id!==e.id)).concat(wider);
  for(const x of cands){
    const vx=V(x,lang), k=key(vx);
    if(seen.has(k)) continue;
    if(vx.w===ve.w||vx.fr===ve.fr) continue;
    if(type==="listen"&&(vx.say===ve.say||(vx.rom&&vx.rom===ve.rom))) continue;
    seen.add(k); out.push(x.id); if(out.length===3) break;
  }
  return out;
}
function autoListen(){const Q=UI.quiz; if(!Q||Q.done) return; const q=Q.qs[Q.i]; if(q&&q.type==="listen"&&q.ans===null) setTimeout(()=>speak(V(ALL[q.id],S.lang).say,S.lang),250);}
function renderQuizSetup(){
  const lang=S.lang, src=UI.quizSrc, qs=S.quiz[lang];
  const opt=(s,label)=>`<button class="chip" data-act="quizSrc" data-v="${s}" aria-pressed="${src===s}">${esc(label)}</button>`;
  return `<section class="card setup-hero"><p class="eyebrow">Quiz · ${LANGS[lang].name}</p><h2>10 questions, 4 choix</h2>
      <p>Trois types de questions se mélangent : lire le mot et trouver le sens, retrouver le mot à partir du français${canSpeak(lang)?", et écouter puis choisir":""}. Chaque bonne réponse rapporte 2 XP.</p>
      <div class="stats3"><div><b>${qs.n}</b><span>quiz joués</span></div><div><b>${qs.best}</b><span>meilleur score</span></div><div><b>${S.xp}</b><span>XP total</span></div></div>
      <button class="btn primary block" data-act="startQuiz" data-src="${src}">Lancer · ${esc(srcName(src))}</button></section>
    <section><div class="sec"><h2>Sur quoi ?</h2></div><div class="chips">${opt("all","Tout le vocabulaire")}${opt("phrases","Kit de voyage")}${THEMES.map(t=>opt(t.id,t.name)).join("")}</div></section>
    ${canSpeak(lang)?"":`<div class="note"><span><b>Pas de questions d’écoute</b> · aucune voix ${esc(LANGS[lang].name.toLowerCase())} n’est installée sur cet appareil. Voir l’onglet Progrès.</span></div>`}`;
}
function renderQuiz(){
  const Q=UI.quiz; if(!Q) return renderQuizSetup();
  const lang=S.lang, L=LANGS[lang];
  if(Q.done){
    const n=Q.qs.length, s=Q.score;
    const msg=s===n?"Parfait. Tu peux passer à un autre thème.":s>=n*.7?"Très bien ! Encore un ou deux tours et c’est acquis.":s>=n*.4?"C’est un début. Une séance de cartes sur ces mots aidera beaucoup.":"Ces mots sont encore nouveaux. Passe d’abord par les cartes, puis retente.";
    return `<section class="card result"><p class="eyebrow">${esc(srcName(Q.src))}</p><div class="score">${s}<small> / ${n}</small></div><h2>Quiz terminé</h2><p>${msg}</p>
      <div class="actions" style="width:100%">${Q.wrong.length?`<button class="btn" data-act="mistakes">Revoir mes ${Q.wrong.length} erreur${Q.wrong.length>1?"s":""}</button>`:""}<button class="btn primary" data-act="startQuiz" data-src="${Q.src==="mist"?"all":Q.src}">Rejouer</button></div>
      <button class="btn ghost block" data-act="endQuiz">Retour</button></section>`;
  }
  const q=Q.qs[Q.i], e=ALL[q.id], v=V(e,lang), r=reading(v,lang), answered=q.ans!==null, ok=q.ans===q.id;
  let prompt;
  if(q.type==="read") prompt=`<p class="q">Que veut dire…</p>${bigWord(v.w,lang,280,96)}${S.rom&&r?`<p class="reading muted">${esc(r)}</p>`:""}`;
  else if(q.type==="write") prompt=`<p class="q">Comment dit-on en ${L.L}…</p><p class="fr-big" style="font-size:26px;font-weight:700">${esc(v.fr)}</p>`;
  else prompt=`<p class="q">Écoute et choisis le sens</p><button class="bigplay" data-act="say" data-t="${esc(v.say)}" data-l="${lang}" aria-label="Réécouter">${ICON.speaker}</button><p class="muted" style="font-size:13px">Touche pour réécouter</p>`;
  const opts=q.opts.map(oid=>{
    const vo=V(ALL[oid],lang); let cls="";
    if(answered){ if(oid===q.id) cls="ok"; else if(oid===q.ans) cls="ko"; }
    const inner=q.type==="write"?`<span class="o-tx">${tx(vo.w,lang)}</span>${S.rom&&reading(vo,lang)?`<small>${esc(reading(vo,lang))}</small>`:""}`:esc(vo.fr);
    return `<button class="opt ${cls}" data-act="answer" data-id="${oid}" ${answered?"disabled":""}>${inner}</button>`;
  }).join("");
  const fb=answered?`<div class="fb ${ok?"ok":"ko"}"><p class="fb-h">${ok?"Bonne réponse !":"Pas tout à fait."}</p><div class="fb-w">${sayBtn(v.say,lang)}<span>${tx(v.w,lang)}</span></div>${r?`<p class="muted" style="font-size:13px">${esc(r)}</p>`:""}<p>${esc(v.fr)}</p></div>
      <button class="btn primary block" data-act="next" style="min-height:52px">${Q.i+1<Q.qs.length?"Question suivante":"Voir le résultat"}</button>`:"";
  return `<div class="session-top"><button class="iconbtn" data-act="endQuiz" aria-label="Quitter le quiz">${ICON.close}</button><div class="pbar"><i style="width:${Math.round((Q.i+(answered?1:0))/Q.qs.length*100)}%"></i></div><span class="cnt">${Q.i+1} / ${Q.qs.length} · ${Q.score} pt${Q.score>1?"s":""}</span></div>
    <div class="prompt">${prompt}</div><div class="opts">${opts}</div>${fb}`;
}

function toTop(){try{window.scrollTo({top:0});}catch(e){window.scrollTo(0,0);}}
let toastT;
function toast(msg){const el=$("#toast"); el.textContent=msg; el.hidden=false; clearTimeout(toastT); toastT=setTimeout(()=>{el.hidden=true;},2800);}

/* Dialogue : lecture enchaînée */
let seq=null;
function markLine(i){document.querySelectorAll(".bubble").forEach((el,k)=>el.classList.toggle("speaking",k===i)); const el=document.querySelector('.bubble[data-line="'+i+'"]'); if(el){try{el.scrollIntoView({block:"nearest",behavior:"smooth"});}catch(e){}}}
function updatePlayBtn(){const b=$("#dlgPlay"); if(b) b.innerHTML=seq?ICON.stop+" Arrêter":ICON.play+" Tout écouter";}
function stopSeq(){if(!seq) return; seq=null; try{window.speechSynthesis.cancel();}catch(e){} markLine(-1); updatePlayBtn();}
function stepSeq(){
  if(!seq) return; const lines=seq.lines;
  if(seq.i>=lines.length){stopSeq(); return;}
  markLine(seq.i); const tok=++seq.tok, text=lines[seq.i].t;
  const adv=()=>{if(seq&&seq.tok===tok){seq.tok++; seq.i++; setTimeout(stepSeq,450);}};
  const u=speak(text,S.lang,adv); if(!u){stopSeq(); return;}
  const per=S.lang==="en"?110:320; setTimeout(adv,(Array.from(text).length*per+4000)/S.rate);
}

/* ================= ACTIONS ================= */
const A={
  lang(b){stopSeq(); S.lang=b.dataset.l; save(); UI.review=null; UI.quiz=null; UI.confirmReset=false; render();},
  tab(b){stopSeq(); UI.tab=b.dataset.tab; if(UI.tab==="learn"&&UI.learn.screen!=="home"&&b.getAttribute("aria-current")) UI.learn={screen:"home"}; UI.confirmReset=false; render(); toTop();},
  go(b){stopSeq(); UI.learn={screen:b.dataset.screen,id:b.dataset.id}; UI.tab="learn"; render(); toTop();},
  back(){stopSeq(); UI.learn={screen:"home"}; render(); toTop();},
  say(b){if(seq) stopSeq(); speak(b.dataset.t,b.dataset.l||S.lang);},
  wtab(b){UI.wtab=b.dataset.v; render();},
  kb(b){UI.kb[b.dataset.k]=b.dataset.v; render(); const k=UI.kb; speak(String.fromCharCode(0xAC00+(KO_I.indexOf(k.i)*21+KO_V.indexOf(k.v))*28+KO_F.indexOf(k.f)),"ko");},
  dlgToggle(b){UI.dlg[b.dataset.k]=!UI.dlg[b.dataset.k]; render();},
  dlgPlay(){
    if(seq){stopSeq(); return;}
    const d=DIALOGUES[S.lang].find(x=>x.id===UI.learn.id)||DIALOGUES[S.lang][0];
    seq={lines:d.L,i:0,tok:0}; updatePlayBtn(); stepSeq();
  },
  startReview(b){startReview(b.dataset.src);},
  dir(b){S.dir=b.dataset.v; save(); render();},
  flip(){const R=UI.review; if(!R||R.flipped) return; R.flipped=true; render(); if(S.auto) speak(V(ALL[R.q[R.i]],S.lang).say,S.lang);},
  know(){const R=UI.review; grade(R.q[R.i],true); R.ok++; nextCard();},
  again(){const R=UI.review, id=R.q[R.i]; grade(id,false); R.bad++; if(!R.re[id]){R.re[id]=1; R.q.push(id);} nextCard();},
  endReview(){UI.review=null; render(); toTop();},
  quizSrc(b){UI.quizSrc=b.dataset.v; render();},
  startQuiz(b){startQuiz(b.dataset.src);},
  answer(b){
    const Q=UI.quiz, q=Q.qs[Q.i]; if(q.ans!==null) return;
    q.ans=b.dataset.id; const ok=q.ans===q.id, p=S.prog[S.lang];
    if(ok){Q.score++; addXP(2); if(!p[q.id]) p[q.id]={b:1,d:today()+1};}
    else {Q.wrong.push(q.id); p[q.id]={b:0,d:today()};}
    save(); render();
    if(S.auto) speak(V(ALL[q.id],S.lang).say,S.lang);
  },
  next(){
    const Q=UI.quiz; Q.i++;
    if(Q.i>=Q.qs.length){Q.done=true; const st=S.quiz[S.lang]; st.n++; st.best=Math.max(st.best,Q.score); if(Q.score>=8) addXP(5); save();}
    render(); toTop(); autoListen();
  },
  mistakes(){const Q=UI.quiz; const ids=Q.wrong.slice(); UI.quiz=null; startReview("mist",ids);},
  endQuiz(){UI.quiz=null; render(); toTop();},
  set(b){const k=b.dataset.k, v=b.dataset.v; if(k==="rate") S.rate=parseFloat(v); else S[k]=v==="1"; save(); render(); if(k==="rate") speak(GREET[S.lang].w,S.lang);},
  hideHint(){S.hideHint=true; save(); render();},
  resetAsk(){UI.confirmReset=true; render();},
  resetNo(){UI.confirmReset=false; render();},
  resetYes(){const keep={lang:S.lang,rate:S.rate,rom:S.rom,auto:S.auto,dir:S.dir}; S=Object.assign(defaults(),keep); save(); UI.confirmReset=false; UI.review=null; UI.quiz=null; render(); toast("Progression effacée.");}
};
function nextCard(){const R=UI.review; R.i++; R.flipped=false; if(R.i>=R.q.length) R.done=true; render();}

document.addEventListener("click",ev=>{
  const b=ev.target.closest("[data-act]"); if(!b||b.disabled) return;
  const f=A[b.dataset.act]; if(f) f(b,ev);
});
document.addEventListener("keydown",ev=>{
  if(ev.key!=="Enter"&&ev.key!==" ") return;
  const b=ev.target.closest('[role="button"][data-act]'); if(!b) return;
  ev.preventDefault(); const f=A[b.dataset.act]; if(f) f(b,ev);
});

render();
if("serviceWorker" in navigator){window.addEventListener("load",()=>{navigator.serviceWorker.register("sw.js").catch(()=>{});});}
})();
</script>
</body>
